     MY ACCOUNT
     ===================================================== -->

<main>


<section class="auth-section">

    <div class="container">

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-card-header">

                <span class="section-label">
                    MY ACCOUNT
                </span>


                <h2 id="welcomeMessage">
                    Welcome

                    Manage your PVC Global account and
                    study abroad journey.
                </p>

            <!-- =================================================
                 USER INFORMATION
                 ================================================= -->

            <div class="account-info">


                <!-- FULL NAME -->

                <div class="account-info-item">

                    <i class="fas fa-user"></i>

                    <div>

                        <small>
                            Full Name
                        </small>

                        <strong id="userName">

                        </strong>

                    </div>

                <!-- EMAIL -->

                <div class="account-info-item">

                    <i class="fas fa-envelope"></i>

                    <div>

                        <small>
                            Email Address
                        </small>

                        <strong id="userEmail">
                            Loading...
                        </strong>

                    </div>

                </div>



                <!-- PHONE -->

                <div class="account-info-item">

                    <i class="fas fa-phone"></i>

                    <div>

                        <small>
                            Contact Number
                        </small>

                        <strong id="userPhone">
                            Loading...
                        </strong>

                    </div>

                </div>


            </div>



            <!-- =================================================

                 ================================================= -->

                    href="universities.html"
                    class="account-feature"
                >

                    <i class="fas fa-heart"></i>

                    <span>
                        Shortlisted Universities
                    </span>

                </a>



                <!-- MY CONVERSATIONS -->

                <a
                    href="#"
                    class="account-feature"
                >

                    <i class="fas fa-comments"></i>

                    <span>
                        My Conversations
                    </span>

                </a>


            </div>


        </div>

    </div>

</section>


</main>



<!-- =====================================================
     MAIN JAVASCRIPT
     ===================================================== -->

<script src="../js/main.js"></script>



<!-- =====================================================
     ACCOUNT PAGE SCRIPT
     ===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        // -------------------------------------------------
        // GET LOGGED-IN USER
        // -------------------------------------------------

        const storedUser =
            sessionStorage.getItem("pvc_user");


        // -------------------------------------------------
        // USER NOT LOGGED IN
        // -------------------------------------------------

        if (!storedUser) {

            window.location.href =
                "login.html";

            return;
        }


        // -------------------------------------------------
        // READ USER DATA
        // -------------------------------------------------

        try {

            const user =
                JSON.parse(storedUser);


            // -------------------------------------------------
            // WELCOME MESSAGE
            // -------------------------------------------------

            const welcomeMessage =
                document.getElementById(
                    "welcomeMessage"
                );

            if (welcomeMessage) {

                welcomeMessage.textContent =
                    "Hello, " +
                    (user.full_name || "User");

            }



            // -------------------------------------------------
            // FULL NAME
            // -------------------------------------------------

            const userName =
                document.getElementById(
                    "userName"
                );

            if (userName) {

                userName.textContent =
                    user.full_name ||
                    "Not available";

            }



            // -------------------------------------------------
            // EMAIL
            // -------------------------------------------------

            const userEmail =
                document.getElementById(
                    "userEmail"
                );

            if (userEmail) {

                userEmail.textContent =
                    user.email ||
                    "Not available";

            }



            // -------------------------------------------------
            // PHONE
            // -------------------------------------------------

            const userPhone =
                document.getElementById(
                    "userPhone"
                );

            if (userPhone) {

                
                userPhone.textContent =
                    user.phone ||
                    "Not available";

            }


        } catch (error) {

            console.error(
                "USER DATA ERROR:",
                error
            );


            // Clear invalid login data

            sessionStorage.removeItem(
                "pvc_user"
            );


            sessionStorage.removeItem(
                "pvc_access_token"
            );


            // Redirect to login

            window.location.href =
                "login.html";

        }

    }

);

</script>


</body>

</html>
